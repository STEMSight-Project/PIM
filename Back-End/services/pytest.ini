[pytest]
# Directory where pytest will look for tests
testpaths = tests

# Pattern to match test files
python_files = test_*.py *_test.py

# Pattern to match test functions
python_functions = test_*

# Add the services folder to sys.path so imports resolve correctly
# This ensures 'from services.xxx import yyy' works
# When running pytest from the services/ folder, '.' is already included
# but this covers running from repo root as well
pythonpath = .

# Verbose output for debugging
addopts = -v -p no:warnings

