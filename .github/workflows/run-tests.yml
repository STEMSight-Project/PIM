name: CI - Run Backend and Frontend Tests

on:
  push:
    branches: [main, "**"]
  workflow_dispatch: {}

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install backend deps
        working-directory: Back-End
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio httpx

      - name: Run backend pytest
        working-directory: Back-End
        run: |
          python -m pytest -q tests/api_router/test_recording_control.py tests/api_router/test_recording_playback.py || true
        continue-on-error: true

      - name: Upload backend pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-log
          path: Back-End/.pytest_log || Back-End/tests-output.txt || ''

      - name: Install frontend deps
        working-directory: Front-End
        run: |
          npm ci

      - name: Run frontend jest
        working-directory: Front-End
        run: |
          npx jest --runInBand --json --outputFile=jest-results.json || true

      - name: Upload frontend jest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-jest-results
          path: Front-End/jest-results.json

      - name: Upload full repo (optional small snapshot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-snapshot
          path: |
            Front-End/src/__tests__/**
            Back-End/tests/api_router/**
