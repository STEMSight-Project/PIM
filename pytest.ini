# pytest Configuration for PIM Project

[tool:pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths =
    Back-End/tests
    AI_Training/tests

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, multiple components)
    gpu: Tests requiring GPU (CUDA)
    slow: Slow tests (can be skipped with -m "not slow")

# Coverage settings
addopts =
    --strict-markers
    --disable-warnings
    --tb=short
    -ra

# Logging
log_cli = false
log_cli_level = INFO

# Warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (seconds)
timeout = 300

# Minimum Python version
minversion = 3.8
